  </defs>
  <rect width="512" height="512" fill="url(#brand-gradient)" />
  <circle cx="256" cy="256" r="116" fill="none" stroke="#ffffff" stroke-width="28" />
  <path d="M334 178 294 294 178 334l40-116 116-40Z" fill="#ffffff" />
  <circle cx="256" cy="256" r="18" fill="#2563eb" />
